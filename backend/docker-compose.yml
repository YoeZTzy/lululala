services:
  core-service:
    build: .
    container_name: lululala-core
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    mem_limit: 256m
    cpus: 0.5

  gateway:
    image: nginx:1.28-alpine
    container_name: lululala-gateway
    restart: unless-stopped
    depends_on:
      - core-service
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 64m
    cpus: 0.2